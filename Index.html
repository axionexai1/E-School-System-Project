<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E School System - Student Login</title>
</head>
<body>

    <h1>E School System</h1>
    <h2>Welcome Back!</h2>

    <form action="#" method="post">

        <!-- Username / Email -->
        <label for="username">Username or Email Address</label><br>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter Username or Email"
            required
        ><br><br>

        <!-- Password -->
        <label for="password">Password</label><br>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
            required
        ><br><br>

        <!-- Forgot Password -->
        <a href="#">Forgot Password?</a><br><br>

        <!-- Remember Me -->
        <input
            type="checkbox"
            id="remember"
            name="remember"
        >
        <label for="remember">Remember Me</label>
        <br><br>

        <!-- Terms & Conditions -->
        <input
            type="checkbox"
            id="terms"
            name="terms"
            required
        >
        <label for="terms">
            I agree to the Terms &amp; Conditions
        </label>
        <br><br>

        <!-- Privacy Policy -->
        <input
            type="checkbox"
            id="privacy"
            name="privacy"
            required
        >
        <label for="privacy">
            I have read and agree to the Privacy Policy
        </label>
        <br><br>

        <!-- Login Button -->
        <button type="submit">Login</button>

        <!-- Contact School -->
        <button type="button">Contact School</button>

    </form>

</body>
</html>
