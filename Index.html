<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E School System - Login</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <div class="container">

            <!-- Left Section -->
            <div class="left">
                <div class="left-top-content">
                    <!-- School Logo -->
                    <div class="logo-area">
                        <img src="images/logo.jpeg" alt="School Logo" class="school-logo-top">
                        <span class="logo-text">E School <br><small>System</small></span>
                    </div>

                    <h1>Smart Learning <br>for a <span>Bright Future</span></h1>

                </div>

                <!-- Student/School Picture -->
                <img src="images/students.jpeg" alt="Students Image" class="students-img">
            </div>

            <!-- Right Section -->
            <div class="right">

                <!-- Graduation Icon -->
                <div class="grad-icon-container">
                    <div class="grad-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                </div>

                <h1>Welcome Back!</h1>
                <p class="subtitle">Login to continue to your learning dashboard</p>

                <form id="loginForm">
                    <!-- Username Input Group -->
                    <div class="input-group">
                        <label>Username or Email Address</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-user field-icon"></i>
                          <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
                        </div>
                    </div>

                    <!-- Password Input Group -->
                    <div class="input-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock field-icon"></i>
                            <input type="password" id="password" name="password" placeholder="Enter your password" required>
                            <i class="fa-regular fa-eye-slash toggle-password"></i>
                        </div>
                    </div>

                    <!-- Options Container (Remember Me & Terms combined cleanly) -->
                    <div class="options-container">
                        <!-- Remember Me -->
                        <div class="checkbox-container">
                            <input type="checkbox" id="remember">
                            <label for="remember">Remember Me</label>
                        </div>

                        <!-- Single Terms & Privacy Checkbox -->
                        <div class="checkbox-container">
                            <input type="checkbox" id="terms-privacy" required>
                            <label for="terms-privacy">
                                I agree to the <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a> <span class="required-tag">(Required)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn-login">
                        <i class="fa-solid fa-lock"></i> Login to Dashboard
                    </button>
                </form>

                <!-- Help Section -->
                <div class="help-section">
                    <div class="help-content">
                        <div class="help-icon">
                            <i class="fa-solid fa-headset"></i>
                        </div>
                        <div class="help-text">
                            <h3>Need Help?</h3>
                            <p>Contact your school for assistance.</p>
                        </div>
                    </div>
                    <button type="button" class="btn-contact">Contact School <i class="fa-solid fa-angle-right"></i></button>
                </div>

            </div>

        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-left">
                <img src="images/logo.jpeg" alt="E School Logo" class="school-logo">
                <div>
                    <h3>E School System</h3>
                    <p>Empowering Education,<br>Building Futures.</p>
                </div>
            </div>

            <div class="footer-center">
                
                <p>Powered by </p>
                <img src="images/Axionex-logo.jpeg" alt="Axionex Logo" class="axionex-logo">
                <h4>Axionex AI</h4>
            </div>

            <div class="footer-right">
                <p>© 2026 E School System. All rights reserved.</p>
            </div>
        </footer>
    </div>

</body>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const response = await fetch('http://127.0.0.1:5000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
    });

    const result = await response.json();

    if (result.success) {
        alert('Login successful!');
    } else {
        alert('Login failed: ' + result.message);
    }
});
</script>
</html>
