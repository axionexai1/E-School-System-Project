{% extends "base.html" %}

{% block title %}
Software Admin Dashboard
{% endblock %}

{% block content %}

<div class="card shadow">
<div class="card-header bg-primary text-white">
<h3 class="mb-0">Software Admin Dashboard</h3>
</div>

<div class="card-body">

<h5>Welcome, {{ current_user.full_name }}</h5>

<hr>

<div class="list-group">

<a href="{{ url_for('software_admin.profile') }}"

 Profile
</a>

<a href="{{ url_for('software_admin.settings') }}"

class="list-group-item list-group-item-action">
Create School Admin

<a href="{{ url_for('software_admin.school_admins') }}"
