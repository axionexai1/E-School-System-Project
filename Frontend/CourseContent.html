<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="home-dashboard.css">
    <link rel="stylesheet" href="course-content.css">
</head>
<body>
    <!-- ========================================================= -->
    <!-- Course Content Section Starts -->
    <!-- ========================================================= -->

    <section id="course-content-section" class="dashboard-section">

        <!-- Back to Dashboard -->
        <a href="dashboard1.html" id="back-to-dashboard" class="back-link">
            <span class="back-icon" aria-hidden="true">←</span>
            Back to Dashboard
        </a>

        <!-- Section Header -->
        <div id="course-content-header" class="section-header">

            <h2 id="course-content-title" class="section-title">
                Course Content
            </h2>

            <p id="course-content-description" class="section-description">
                This is the digital library for each subject. Students can read
                notes, watch videos, and download study materials from here.
            </p>

        </div>

        <!-- Subject List Card -->
        <article id="subject-list-card" class="dashboard-card">

            <div class="card-header">
                <h3 class="card-title">Subject List</h3>
            </div>

            <div class="card-body">

                <!-- Note: icon + name for each subject are added by the Admin.
                     Students only view this list; nothing here is student-editable. -->
                <ul id="subject-list" class="subject-list">

                    <li class="subject-item">
                        <a href="english.html" id="english-link" class="subject-link">
                            <span class="subject-icon" aria-hidden="true">📘</span>
                            <span class="subject-name">English</span>
                        </a>
                    </li>

                    <li class="subject-item">
                        <a href="mathematics.html" id="mathematics-link" class="subject-link">
                            <span class="subject-icon" aria-hidden="true">📐</span>
                            <span class="subject-name">Mathematics</span>
                        </a>
                    </li>

                    <li class="subject-item">
                        <a href="science.html" id="science-link" class="subject-link">
                            <span class="subject-icon" aria-hidden="true">🔬</span>
                            <span class="subject-name">Science</span>
                        </a>
                    </li>

                    <li class="subject-item">
                        <a href="computer.html" id="computer-link" class="subject-link">
                            <span class="subject-icon" aria-hidden="true">💻</span>
                            <span class="subject-name">Computer</span>
                        </a>
                    </li>

                    <li class="subject-item">
                        <a href="others.html" id="others-link" class="subject-link">
                            <span class="subject-icon" aria-hidden="true">📚</span>
                            <span class="subject-name">Others</span>
                        </a>
                    </li>

                </ul>

            </div>

        </article>

        

    <!-- ========================================================= -->
    <!-- Course Content Section Ends -->
    <!-- ========================================================= -->
</body>
</html>
