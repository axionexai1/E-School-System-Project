<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
</head>
<body>
<!-- ========================================================= -->
<!-- Logout Section Starts -->
<!-- ========================================================= -->

<section id="logout-section" class="dashboard-section">

    <div id="logout-header" class="section-header">
        <h2 id="logout-title" class="section-title">Logout</h2>
        <p id="logout-description" class="section-description">
            You have been securely logged out of the Student Portal.
        </p>
    </div>

    <article id="logout-card" class="dashboard-card">
        <div class="card-header">
            <h3 class="card-title">Session Ended</h3>
        </div>
        <div class="card-body">
            <p id="logout-message" class="card-text">
                Thank you for using the Student Portal. Your session has
                ended. Please log in again to continue.
            </p>

            <ul id="logout-actions" class="logout-actions">
                <li class="logout-action-item">
                    <a href="dashboard.html" class="btn">Back to Dashboard</a>
                </li>
                <li class="logout-action-item">
                    <a href="Index.html" class="btn">Log In Again</a>
                </li>
            </ul>
        </div>
    </article>

</section>

<!-- ========================================================= -->
<!-- Logout Section Ends -->
<!-- ========================================================= -->
</body>
</html>
